<h1 style="font-size:44px">Le cycle de Krebs</h1>
<p>Le cycle de Krebs se déroule dans la matrice mitochondriale.</p>
<p>Il oxyde l'acétyl coenzyme A en dioxyde de carbone.</p>
<p>Chaque tour produit trois NADH, un FADH2 et un GTP.</p>
<p>La citrate synthase catalyse la première réaction du cycle.</p>
