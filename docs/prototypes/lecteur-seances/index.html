<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur de cours · plusieurs fiches</title>
<style>
/* Prototype : le lecteur ACTUEL de MedRevise, reproduit tel quel, + 4 ajouts marqués « Nouveau ».
   Tout est fictif et en mémoire (aucun lien avec l'app ni avec les données réelles). */
:root {
  --bg: #0B0B0F; --bg-2: #121218; --card: #15151C; --card-2: #1B1B24; --elev: #1E1E27;
  --border: #2A2A33; --border-2: #222229; --border-hover: #3A3A43;
  --text: #F2F2F5; --text-2: #A7A7B3; --text-3: #6E6E7A;
  --accent: #A47BFF; --accent-soft: color-mix(in srgb, #A47BFF 15%, transparent);
  --ok: #3FAE7A; --crit: #E5677D; --live: #FF5470;
  --police: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--police); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; flex: 0 0 auto; }

/* ---------- bandeau du prototype (hors app) ---------- */
.guide { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 16px; background: #17122b; border-bottom: 1px solid #3a2d6b; font-size: 13px; }
.guide b { color: #d9ccff; }
.guide .etape { border: 1px solid #4a3a85; background: #221a40; color: #e7e0ff; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; }
.guide .etape:hover { background: #2d2357; }
.guide .etape span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; margin-right: 6px; }
.guide .droite { margin-left: auto; color: #a99bd8; font-size: 12px; }

/* ---------- l'app ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 76px 1fr; padding: 14px 14px 14px 0; gap: 0; }
.nav { margin-left: 14px; border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0; background: var(--bg); }
.nav .logo { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #5b47b8; display: grid; place-items: center; color: var(--accent); margin-bottom: 12px; }
.nav button { width: 38px; height: 38px; border-radius: 10px; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; }
.nav button.actif { background: var(--accent); color: #fff; }
.nav .bas { margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.nav .av { width: 30px; height: 30px; border-radius: 50%; background: #8f6bff; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.lecteur { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding-left: 20px; }

.entete { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px 4px; }
.entete .titre { font-weight: 800; font-size: 15px; } .entete .nb { color: var(--text-3); font-size: 12px; margin-left: 8px; }
.lien-fichier { display: block; border: 0; background: none; padding: 2px 0; font-size: 12.5px; color: var(--text-2); }
.lien-fichier:hover { color: var(--text); }
.dispo { margin-left: auto; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; }
.dispo button { border: 0; background: none; color: var(--text-2); padding: 5px 10px; border-radius: 7px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.dispo button.actif { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }

.barre { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-2); }
.grp { display: flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 10px; padding: 3px; background: var(--bg); }
.grp button { border: 0; background: none; color: var(--text-2); padding: 5px 8px; border-radius: 7px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.grp button:hover { color: var(--text); background: var(--card); }
.grp button.actif { background: var(--accent-soft); color: var(--accent); }
.grp .num { font: 600 12.5px var(--mono); color: var(--text-2); padding: 0 4px; display: flex; align-items: center; gap: 4px; }
.grp .num input { width: 42px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font: 600 12.5px var(--mono); text-align: center; padding: 3px 2px; }
.btn-doc { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; max-width: 360px; }
.btn-doc:hover { border-color: var(--border-hover); }
.btn-doc .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-doc .s { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; flex: 0 0 auto; }
.recherche { margin-left: auto; display: flex; align-items: center; gap: 8px; width: 220px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; color: var(--text-3); font-size: 13px; }
.nouveau { font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 5px; flex: 0 0 auto; }

.corps { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 360px; gap: 14px; padding-top: 12px; }
.pages { overflow: auto; border-radius: 12px; background: var(--bg-2); padding: 18px 18px 120px 46px; position: relative; scroll-behavior: auto; }
.page { position: relative; margin: 0 auto 18px; max-width: 840px; }
.diapo { aspect-ratio: 4 / 3; background: #fff; color: #1f1f2a; border-radius: 4px; padding: 5% 7%; display: flex; flex-direction: column; }
.diapo .tt { font-weight: 800; font-size: clamp(16px, 2.3vw, 30px); color: #312a7a; padding-bottom: 3%; border-bottom: 3px solid var(--sc); margin-bottom: 5%; }
.diapo ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4%; font-size: clamp(11px, 1.4vw, 19px); color: #333; }
.diapo .pied { margin-top: auto; display: flex; justify-content: space-between; color: #9a9aa8; font-size: 11px; }
.fiche { background: #fffdf8; color: #22222b; border-radius: 4px; padding: 34px 40px 40px; min-height: 560px; }
.fiche .sur { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a85b5; }
.fiche h3 { margin: 6px 0 16px; font-size: 22px; color: #2a2560; }
.fiche ul { margin: 0; padding-left: 20px; display: grid; gap: 12px; font-size: 15.5px; }
.fiche li { border-radius: 4px; padding: 1px 4px; cursor: text; }
.fiche li.surligne { background: #fff1a6; }
.fiche .pied { margin-top: 26px; color: #a19db5; font-size: 11px; text-align: right; }
/* marge gauche : tags Début / Fin (existant) */
.tag { position: absolute; left: -36px; top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tag .ic-tag { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; color: var(--text-3); }
.pastille { position: absolute; left: 10px; top: 10px; z-index: 2; background: var(--ok); color: #fff; border-radius: 7px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; display: flex; gap: 5px; align-items: center; box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.pastille.fin { background: var(--crit); }
.badge-trans { position: absolute; right: 10px; top: 10px; z-index: 2; background: rgba(20,20,30,.85); color: #fff; border-radius: 7px; font-size: 11.5px; padding: 3px 8px; display: flex; gap: 5px; align-items: center; border: 0; }
/* NOUVEAU : lien d'une page de fiche vers la diapo d'origine */
.origine { position: absolute; right: 12px; top: 12px; z-index: 2; display: flex; align-items: center; gap: 6px; border: 1px solid #d9d2fb; background: #f3efff; color: #4b3fb0; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.origine:hover { background: #e7e0ff; }
.retour-fiche { position: sticky; top: 0; z-index: 5; margin: -6px auto 12px; width: fit-content; display: flex; gap: 8px; align-items: center; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.7); }

/* panneau latéral (existant) */
.panneau { border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.onglets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 10px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; }
.onglets button { border: 0; background: none; color: var(--text-2); padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 600; }
.onglets button.actif { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
.onglets .rouge { color: var(--live); }
.p-corps { overflow: auto; padding: 0 12px 14px; display: grid; gap: 8px; align-content: start; flex: 1; min-height: 0; }
.p-corps h5 { margin: 8px 2px 2px; font-size: 12px; color: var(--text-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--border-hover); }
.btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.rouge { background: none; border-color: color-mix(in srgb, var(--live) 50%, var(--border)); color: var(--live); }
.btn.plein { width: 100%; }
.seance { display: grid; gap: 3px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.seance:hover { border-color: var(--border-hover); }
.seance b { font-size: 13.5px; } .seance small { color: var(--text-3); font-size: 12px; }
.s-num { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-right: 6px; }
.ligne { display: grid; grid-template-columns: 42px 1fr; gap: 8px; font-size: 13px; padding: 6px 4px; border-radius: 8px; }
.ligne .h { font: 600 11px var(--mono); color: var(--text-3); padding-top: 2px; }
.ligne .p { border: 0; background: none; color: var(--accent); font: 600 11px var(--mono); padding: 0 0 0 4px; }
.ligne.neuve { background: var(--accent-soft); animation: arrivee .5s ease-out; }
@keyframes arrivee { from { opacity: 0; transform: translateY(5px); } }
.enreg { display: flex; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--live) 40%, var(--border)); background: color-mix(in srgb, var(--live) 8%, var(--card)); border-radius: 12px; padding: 10px 12px; }
.point { width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: pouls 1.2s infinite; }
@keyframes pouls { 50% { opacity: .25; } }
.carte { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.carte small { color: var(--text-3); display: block; margin-bottom: 3px; }
.carte .v { color: var(--text-2); margin-top: 3px; }
.vide { color: var(--text-3); font-size: 12.5px; text-align: center; padding: 18px 8px; }
.sous-onglets { display: flex; gap: 14px; padding: 0 4px 6px; border-bottom: 1px solid var(--border-2); font-size: 13px; color: var(--text-2); }
.sous-onglets b { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }

/* menus et fenêtres */
.menu { position: fixed; z-index: 30; background: var(--elev); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.8); padding: 6px; min-width: 300px; max-height: 70vh; overflow: auto; }
.menu .grp-t { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 9px 10px 4px; display: flex; gap: 8px; align-items: center; }
.menu .item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; }
.menu .item:hover { background: var(--card-2); }
.menu .item.actif { background: var(--accent-soft); }
.menu .item small { margin-left: auto; color: var(--text-3); font-size: 11.5px; }
.menu .item.sous { padding-left: 30px; }
.menu .item.grise { color: var(--text-3); cursor: default; font-size: 12.5px; }
.menu .sep { height: 1px; background: var(--border); margin: 6px 4px; }
.menu .rouge { color: var(--crit); }
.voile { position: fixed; inset: 0; z-index: 40; background: rgba(5,5,10,.6); display: grid; place-items: center; }
.fen { width: min(540px, 92vw); background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
.fen .t { padding: 16px 18px; font-weight: 800; font-size: 16px; border-bottom: 1px solid var(--border); }
.fen .c { padding: 18px; display: grid; gap: 14px; font-size: 13.5px; }
.fen .p { padding: 12px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
.fen label { display: grid; gap: 6px; font-weight: 600; }
.fen select, .fen input[type=text] { background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; font: 13.5px var(--police); }
.fen .aide { color: var(--text-3); font-size: 12px; font-weight: 500; }
.depot { border: 2px dashed var(--border-hover); border-radius: 12px; padding: 28px; text-align: center; color: var(--text-2); }
.depot:hover { border-color: var(--accent); color: var(--text); }
.coche { display: flex !important; grid-auto-flow: column; align-items: center; gap: 10px; font-weight: 500 !important; }
.coche input { width: 17px; height: 17px; accent-color: var(--accent); }
.tableau-docs { width: 100%; border-collapse: collapse; font-size: 13px; }
.tableau-docs td { padding: 8px 6px; border-bottom: 1px solid var(--border-2); }
.tableau-docs td:last-child { text-align: right; color: var(--text-3); }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px); opacity: 0; transition: .25s; z-index: 60; background: var(--elev); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; font-size: 13.5px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); pointer-events: none; }
.toast.vu { opacity: 1; transform: translateX(-50%); }
.anneau { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; animation: anneau 1s 3; }
@keyframes anneau { 50% { outline-color: transparent; } }
</style>
</head>
<body>
<div class="guide">
  <b>Prototype</b> — le lecteur d’aujourd’hui, plus 4 ajouts marqués <span class="nouveau">Nouveau</span>. À essayer :
  <button class="etape" data-guide="1"><span>1</span>Changer de document</button>
  <button class="etape" data-guide="2"><span>2</span>Ajouter une fiche</button>
  <button class="etape" data-guide="3"><span>3</span>Fiche → diapo d’origine</button>
  <button class="etape" data-guide="4"><span>4</span>Transcrire le cours d’aujourd’hui</button>
  <span class="droite">Données fictives · rien n’est enregistré</span>
</div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== données d'exemple ===================== */
const COURS = { titre: 'Physiologie rénale', pages: 300 };
const SEANCES = [
  { id: 's1', n: 1, date: 'mer. 1 oct.', de: 1, a: 58, titre: 'Anatomie du rein et du néphron', couleur: '#8B7BEA', duree: '1 h 52' },
  { id: 's2', n: 2, date: 'mer. 8 oct.', de: 59, a: 121, titre: 'Filtration glomérulaire et clairances', couleur: '#3FA7D6', duree: '2 h 05' },
  { id: 's3', n: 3, date: 'mer. 15 oct.', de: 122, a: 180, titre: 'Transports tubulaires', couleur: '#2FB58A', duree: '1 h 58' },
  { id: 's4', n: 4, date: 'mer. 22 oct.', de: 181, a: 243, titre: 'Eau, sodium et ADH', couleur: '#E9A23B', duree: '2 h 01' },
  { id: 's5', n: 5, date: 'aujourd’hui', de: 244, a: 300, titre: 'Équilibre acide-base', couleur: '#E5677D', duree: null },
];
const TITRES = {
  s1: ['Plan du cours', 'Situation des reins', 'Rapports anatomiques', 'Coupe frontale du rein', 'Cortex et médullaire', 'Pyramides de Malpighi', 'Vascularisation artérielle', 'Le néphron', 'Corpuscule de Malpighi', 'Tube contourné proximal', 'Anse de Henle', 'Appareil juxtaglomérulaire'],
  s2: ['Rappels séance 1', 'Barrière de filtration', 'Podocytes et fentes', 'Forces de Starling', 'Pression oncotique', 'DFG : définition', 'Valeurs normales du DFG', 'Autorégulation', 'Rétrocontrôle tubulo-glomérulaire', 'Notion de clairance', 'Clairance de l’inuline', 'Clairance de la créatinine', 'Clairance du PAH', 'Exercices de calcul'],
  s3: ['Plan', 'Na⁺/K⁺-ATPase', 'TCP : réabsorption du Na⁺', 'SGLT2 et glucose', 'Seuil rénal du glucose', 'Anse de Henle', 'NKCC2', 'TCD : NCC', 'Canal collecteur : ENaC', 'Aldostérone', 'Diurétiques'],
  s4: ['Plan', 'Compartiments liquidiens', 'Osmolalité plasmatique', 'Gradient cortico-papillaire', 'Contre-courant', 'ADH', 'Aquaporine 2', 'Hyponatrémie', 'SIADH', 'Diabète insipide'],
  s5: ['Plan', 'pH et ions H⁺', 'Tampons du plasma', 'Henderson-Hasselbalch', 'Réabsorption du HCO₃⁻', 'Excrétion acide', 'Ammoniogenèse', 'Acidose métabolique', 'Trou anionique', 'Compensation respiratoire', 'Gaz du sang'],
};
const PHRASES = {
  s1: ['Le rein droit est un peu plus bas que le gauche, à cause du foie.', 'Sur la coupe frontale : cortex en périphérie, médullaire au centre.', 'Les artères segmentaires sont terminales : pas d’anastomoses.', 'Le néphron est l’unité fonctionnelle, environ un million par rein.', 'Le tube contourné proximal réabsorbe les deux tiers du filtrat.'],
  s2: ['La barrière a trois couches : endothélium fenêtré, membrane basale, podocytes.', 'L’albumine est négative : elle passe mal la barrière.', 'Le DFG normal, c’est environ 120 mL par minute.', 'Le DFG reste stable entre 80 et 180 mmHg de pression artérielle.', 'La clairance : C égale U fois V sur P.', 'L’inuline n’est ni réabsorbée ni sécrétée : sa clairance égale le DFG.', 'La créatinine est un peu sécrétée, elle surestime le DFG.'],
  s3: ['Tout repose sur la pompe sodium-potassium au pôle basolatéral.', 'Au TCP, le sodium entre avec le glucose par SGLT2.', 'Au-delà de 180 mg/dL de glycémie : glycosurie.', 'NKCC2 dans la branche ascendante : cible du furosémide.', 'L’aldostérone fait réabsorber le sodium et sécréter le potassium.'],
  s4: ['L’osmolalité plasmatique normale est autour de 285.', 'Le gradient va jusqu’à 1200 dans la papille.', 'L’ADH agit sur les récepteurs V2 et l’aquaporine 2.', 'Une hyponatrémie, c’est d’abord un problème d’eau.'],
  s5: ['Dernière séance du module : l’équilibre acide-base.', 'Le pH normal est entre 7,38 et 7,42.', 'Le principal tampon, c’est le couple bicarbonate / CO₂.', 'Le rein réabsorbe presque tout le bicarbonate filtré.', 'L’ammoniogenèse augmente en cas d’acidose chronique.', 'Devant une acidose métabolique, calculez le trou anionique.', 'PCO₂ attendue : 1,5 fois le bicarbonate plus 8.'],
};
const sDe = (p) => SEANCES.find((s) => p >= s.de && p <= s.a);
const sId = (id) => SEANCES.find((s) => s.id === id);
const titreDiapo = (p) => { const s = sDe(p); const t = TITRES[s.id]; return p === s.de ? 'Séance ' + s.n + ' — ' + s.titre : t[(p - s.de) % t.length]; };
const pucesDiapo = (p) => { const s = sDe(p); const ph = PHRASES[s.id]; return [0, 1, 2].map((k) => ph[(p + k) % ph.length]); };

/* fiches de résumé : plan (une page par titre), et pages du diapo résumées par chaque page */
const PUCES = {
  'Barrière de filtration': ['3 couches : endothélium fenêtré, membrane basale, podocytes', 'Sélectivité de taille (< 70 kDa) et de charge', 'Albumine : 69 kDa, négative → quasi absente de l’urine'],
  'Forces de Starling': ['PUF = (Pcg − Pb) − (πcg − πb)', 'Pcg ≈ 55 mmHg, Pb ≈ 15 mmHg, πcg ≈ 30 mmHg', 'Pression nette ≈ 10 mmHg en début de capillaire'],
  'Valeurs du DFG': ['DFG ≈ 120 mL/min ≈ 180 L/jour', 'Diminue avec l’âge (≈ −1 mL/min/an après 40 ans)', 'Normalisé à 1,73 m² de surface corporelle'],
  'Autorégulation': ['DFG stable pour une PAM de 80 à 180 mmHg', 'Réponse myogénique de l’artériole afférente', 'Rétrocontrôle tubulo-glomérulaire (macula densa)'],
  'Artérioles afférente / efférente': ['Constriction afférente → ↓ Pcg → ↓ DFG', 'Constriction efférente → ↑ Pcg → ↑ DFG', 'Angiotensine II : surtout efférente → maintient le DFG'],
  'Définition et formule': ['Volume de plasma épuré d’une substance par minute', 'C = U × V / P', 'Unité : mL/min'],
  'Inuline et créatinine': ['Inuline : ni réabsorbée ni sécrétée → C = DFG', 'Créatinine : un peu sécrétée → surestime le DFG', 'En pratique : créatinine (dosage simple)'],

  'À retenir': ['La formule de la clairance', 'Les 3 valeurs normales', 'Le piège classique du QCM'],

    <label>Elle résume quelle séance ?<select id="seance-fiche">${dispo}</select>
      <span class="aide">${ic('check', 13)} Proposée parce que la fiche reprend les pages 244 à 300 du diapo.</span></label></div>
    <div class="p"><button class="btn" data-a="fermer">Annuler</button><button class="btn prim" data-a="valider-ajout">Ajouter la fiche</button></div>`);
}
function fenDocs() {
  const lignes = SEANCES.map((s) => { const fs = FICHES.filter((f) => f.seance === s.id);
    return `<tr><td colspan="2" style="padding-top:14px"><b>${pastilleS(s)}Séance ${s.n} · ${s.date}</b> <span style="color:var(--text-3)">· diapo p. ${s.de}–${s.a} · ${s.duree ? 'transcript ' + s.duree : 'pas de transcript'}</span></td></tr>
    ${fs.map((f) => `<tr><td style="padding-left:30px">${ic('fiche', 14)} ${h(f.titre)}</td><td>${f.plan.length} p. · <a href="#" style="color:var(--accent)">changer de séance</a></td></tr>`).join('') || '<tr><td style="padding-left:30px;color:var(--text-3)">aucune fiche</td><td></td></tr>'}`; }).join('');
  fenetre(`<div class="t">Fichiers du cours et séances</div><div class="c" style="max-height:60vh;overflow:auto">
    <table class="tableau-docs"><tr><td>${ic('diapo', 14)} <b>Diapo du cours</b> · Physio-renale-complet.pdf</td><td>${COURS.pages} p. · <a href="#" style="color:var(--accent)">remplacer</a></td></tr>${lignes}</table></div>
    <div class="p"><button class="btn" data-a="ajouter">${ic('import', 14)} Ajouter une fiche…</button><button class="btn prim" data-a="fermer">Fermer</button></div>`);
}
function fenTranscrire() {
  const p = E.doc === 'diapo' ? E.page.diapo : 244;
  fenetre(`<div class="t">Transcrire le cours</div><div class="c">
    <label>Micro<select><option>Micro du MacBook (automatique)</option><option>AirPods</option></select></label>
    <label class="coche"><input type="checkbox" id="marquer" checked> Marquer le début du cours sur la page ${p} <span class="nouveau">Nouveau</span></label>
    <span class="aide">La diapo s’affiche à cette page. À la fin, « Arrêter » marque la fin du cours sur la page où tu seras. Plus besoin de poser les tags à la main.</span></div>
    <div class="p"><button class="btn" data-a="fermer">Annuler</button><button class="btn prim" data-a="demarrer">${ic('micro', 14)} Démarrer</button></div>`);
}

/* ===================== navigation ===================== */
function allerA(n, doux = true) {
  const pg = document.getElementById('pages'); const el = pg && pg.querySelector(`.page[data-p="${n}"]`); if (!el) return;
  pg.scrollTo({ top: el.offsetTop - 14 - (E.retour && E.doc === 'diapo' ? 50 : 0), behavior: doux ? 'smooth' : 'auto' });
  E.page[E.doc] = n; const i = document.getElementById('num'); if (i) i.value = n;
}
function pageVisible() { const pg = document.getElementById('pages'); const y = pg.getBoundingClientRect().top + 140; const els = pg.querySelectorAll('.page'); for (const el of els) if (el.getBoundingClientRect().bottom > y) return +el.dataset.p; return null; }
function afficherDoc(v, page) { E.doc = v; if (page) E.page[v] = page; if (!E.page[v]) E.page[v] = 1; E.retour = null; rendre(); }
let tToast; function toast(m) { const t = document.getElementById('toast'); t.innerHTML = m; t.classList.add('vu'); clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('vu'), 3200); }
function anneau(el) { if (!el) return; el.classList.remove('anneau'); void el.offsetWidth; el.classList.add('anneau'); setTimeout(() => el.classList.remove('anneau'), 3100); }
function majPanneau() { const a = document.querySelector('.panneau'); if (a) { a.innerHTML = panneau(); const c = document.getElementById('p-corps'); if (c && E.live) c.scrollTop = c.scrollHeight; } }

function demarrer() {
  const marquer = document.getElementById('marquer').checked; fermerFen();
  E.doc = 'diapo'; E.retour = null; E.page.diapo = E.page.diapo >= 244 ? E.page.diapo : 244; E.onglet = 'trans'; E.vueTrans = null;
  const debut = E.page.diapo;
  if (marquer) E.tags.push({ p: debut, kind: 'debut', s: 's5' });
  E.live = { sec: 0, page: debut, lignes: [], debut };
  rendre(); toast(marquer ? `${ic('check', 14)} Début du cours marqué sur la page ${debut}` : 'Enregistrement démarré');
  E.live.timer = setInterval(() => {
    const L = E.live; L.sec += 41; const ph = PHRASES.s5;
    if (L.lignes.length && L.lignes.length % 3 === 0 && L.page < 300) { L.page++; allerA(L.page); }
    L.lignes.push({ h: mm(L.sec), t: ph[L.lignes.length % ph.length], p: L.page }); majPanneau();
  }, 1600);
}
function arreter() {
  clearInterval(E.live.timer); const fin = E.page.diapo;
  E.tags.push({ p: fin, kind: 'fin', s: 's5' }); const debut = E.live.debut;
  sId('s5').duree = mm(E.live.sec).replace(':', ' min ').replace(/^0 min /, '') + ' s';
  E.live = null; rendre(); toast(`${ic('check', 14)} Séance 5 enregistrée · cours marqué p. ${debut} → p. ${fin}`);
}

/* ===================== clics ===================== */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-guide]');
  if (g) { fermerMenu(); fermerFen(); const k = g.dataset.guide;
    if (k === '1') { const b = document.getElementById('b-doc'); anneau(b); ouvrirMenu('doc', b); }
    if (k === '2') { const b = document.getElementById('b-fichier'); anneau(b); ouvrirMenu('fichier', b); setTimeout(() => anneau([...document.querySelectorAll('#menu .item')].find((x) => /Ajouter une fiche/.test(x.textContent))), 50); }
    if (k === '3') { if (E.doc === 'diapo') afficherDoc('f2a'); setTimeout(() => anneau(document.querySelector('.origine')), 60); toast('Chaque page de fiche indique la diapo qu’elle résume : clique dessus.'); }
    if (k === '4') { E.onglet = 'trans'; E.vueTrans = null; if (!E.live) { afficherDoc('diapo', 244); setTimeout(() => anneau(document.getElementById('b-transcrire')), 60); } else rendre(); }
    return; }
  const li = e.target.closest('.fiche li');
  if (li && E.outil === 'surligne') { const S = (E.surl[E.doc] = E.surl[E.doc] || []); const k = li.dataset.li; const i = S.indexOf(k); i >= 0 ? S.splice(i, 1) : S.push(k); li.classList.toggle('surligne'); return; }
  const b = e.target.closest('[data-a]');
  if (!b) { if (!e.target.closest('#menu')) fermerMenu(); if (e.target.id === 'voile') fermerFen(); return; }
  const a = b.dataset.a;
  if (a !== 'menu-doc' && a !== 'menu-fichier') fermerMenu();
  switch (a) {
    case 'menu-doc': document.getElementById('menu') ? fermerMenu() : ouvrirMenu('doc', b); break;
    case 'menu-fichier': document.getElementById('menu') ? fermerMenu() : ouvrirMenu('fichier', b); break;
    case 'doc': afficherDoc(b.dataset.v); break;
    case 'prec': allerA(Math.max(1, (E.page[E.doc] || 1) - 1)); break;
    case 'suiv': allerA(Math.min(nbPages(), (E.page[E.doc] || 1) + 1)); break;
    case 'outil': E.outil = b.dataset.v; document.querySelectorAll('[data-a=outil]').forEach((x) => x.classList.toggle('actif', x === b)); if (E.outil === 'surligne') toast('Surligneur : clique une ligne de la fiche'); break;
    case 'onglet': E.onglet = b.dataset.v; majPanneau(); break;
    case 'origine': E.retour = { fiche: E.doc, page: +b.dataset.page }; E.doc = 'diapo'; E.page.diapo = +b.dataset.de; rendre(); break;
    case 'revenir': { const r = E.retour; E.retour = null; afficherDoc(r.fiche, r.page); break; }
    case 'aller-diapo': if (E.doc !== 'diapo') { E.doc = 'diapo'; E.retour = null; E.page.diapo = +b.dataset.p; rendre(); } else allerA(+b.dataset.p); break;
    case 'trans-page': E.onglet = 'trans'; E.vueTrans = sDe(+b.dataset.p).id; majPanneau(); break;
    case 'trans-seance': E.vueTrans = b.dataset.s; majPanneau(); break;
    case 'trans-liste': E.vueTrans = null; majPanneau(); break;
    case 'transcrire': fenTranscrire(); break;
    case 'demarrer': demarrer(); break;
    case 'arreter': arreter(); break;
    case 'ajouter': fenAjouter(1); break;
    case 'choisir': fenAjouter(2); break;
    case 'docs': fenDocs(); break;
    case 'fermer': fermerFen(); break;
    case 'valider-ajout': {
      const s = document.getElementById('seance-fiche').value; const nom = document.getElementById('nom-fiche').value || 'Fiche';
      if (!fiche('f5')) FICHES.push({ ...FICHE_S5, titre: nom, seance: s }); else Object.assign(fiche('f5'), { titre: nom, seance: s });
      fermerFen(); afficherDoc('f5', 1); toast(`${ic('check', 14)} Fiche ajoutée à la séance ${sId(s).n}. La diapo du cours est toujours là, dans le menu du document.`); break;
    }
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'num') { const n = Math.min(nbPages(), Math.max(1, parseInt(e.target.value, 10) || 1)); allerA(n); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { fermerMenu(); fermerFen(); } });
rendre();
</script>
</body>
</html>
